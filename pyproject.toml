[project]
name = "swe-task-harness"
version = "0.1.0"
description = "Package SWE-bench-style coding tasks into containers, validate them, run an agent, grade the result."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "anthropic>=0.69",
]

[project.scripts]
task = "harness.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]


[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests are opt-in: `uv run pytest -m docker`.
addopts = "-q -m 'not docker'"
markers = ["docker: needs a real Docker daemon"]
# Every test here is a function. Without this, domain types named TestStatus /
# TestOutcome / TestRun are picked up as test classes and warn on every run.
python_classes = []
